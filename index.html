<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Studio Manicure - Gestor de Agendamentos</title>

  <!-- Configurações de Aplicativo Mobile (PWA / Tela Cheia - Manicure) -->
  <meta name="theme-color" content="#db2777">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Painel Manicure">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3163/3163195.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3163/3163195.png">
  
  <link rel="manifest" href='data:application/manifest+json,{"name":"Studio Manicure - Agenda","short_name":"Manicure","start_url":".","display":"standalone","background_color":"#121214","theme_color":"#db2777","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3163/3163195.png","sizes":"512x512","type":"image/png"}]}'>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <style>
    body { 
      background-color: #121214; 
      color: #e1e1e6; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .manicure-pink { background-color: #db2777; }
    .card-agendamento { 
      background-color: #202024; 
      border-left: 6px solid #db2777; 
      transition: all 0.2s ease-in-out; 
    }
    .card-confirmado { border-left-color: #f59e0b; }
    .card-concluido { border-left-color: #00875f; opacity: 0.55; }
  </style>
</head>
<body class="min-h-screen flex flex-col select-none">

  <!-- TELA DE LOGIN / BLOQUEIO -->
  <div id="tela-login" class="fixed inset-0 bg-[#121214] z-[100] flex items-center justify-center p-6">
    <div class="bg-[#202024] border border-gray-800 rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center">
      <div class="w-16 h-16 manicure-pink rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
        <i class="fas fa-hand-sparkles text-3xl text-white"></i>
      </div>
      <h2 class="text-xl font-black text-white">STUDIO MANICURE</h2>
      <p class="text-xs text-gray-400 mt-1 mb-6">Acesso restrito à Agenda de Clientes</p>

      <form onsubmit="fazerLogin(event)" class="space-y-4">
        <div class="relative">
          <i class="fas fa-lock absolute left-4 top-3.5 text-gray-500 text-sm"></i>
          <input type="password" id="campo-senha" placeholder="Digite a senha de acesso..." required
                 class="w-full bg-[#121214] border border-gray-700 rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-pink-500 text-center tracking-widest">
        </div>
        <p id="erro-login" class="text-xs text-pink-500 font-bold hidden">Senha incorreta! Tente novamente.</p>
        <button type="submit" class="w-full manicure-pink hover:bg-pink-700 active:scale-95 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg">
          Entrar na Agenda
        </button>
      </form>
    </div>
  </div>

  <!-- AVISO FLUTUANTE (TOAST) -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden bg-pink-600 text-white px-4 py-3 rounded-xl shadow-2xl text-xs font-bold flex items-center gap-2 transition-all">
    <i class="fab fa-whatsapp text-base"></i>
    <span id="toast-msg">Notificação enviada no WhatsApp!</span>
  </div>

  <!-- CABEÇALHO -->
  <header class="manicure-pink text-white px-5 py-3.5 shadow-lg flex justify-between items-center sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-white/15 rounded-xl flex items-center justify-center">
        <i class="fas fa-hand-sparkles text-xl"></i>
      </div>
      <div>
        <h1 class="text-lg font-black tracking-wide leading-tight">STUDIO MANICURE</h1>
        <span class="text-[11px] opacity-90 block font-medium">Gestor de Agendamentos</span>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <div class="bg-black/25 px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-2">
        <span class="w-2 h-2 bg-green-400 rounded-full animate-ping"></span>
        <span><strong id="contador-agenda">0</strong> pendentes</span>
      </div>
      <button onclick="abrirConfigPlanilha()" class="bg-white/20 active:bg-white/30 text-white w-9 h-9 rounded-full flex items-center justify-center transition" title="Configurar Planilha">
        <i class="fas fa-link text-xs"></i>
      </button>
      <button onclick="carregarPlanilha()" class="bg-white/20 active:bg-white/30 text-white w-9 h-9 rounded-full flex items-center justify-center transition" title="Recarregar">
        <i class="fas fa-sync-alt text-xs"></i>
      </button>
      <button onclick="fazerLogout()" class="bg-black/25 hover:bg-black/40 text-white w-9 h-9 rounded-full flex items-center justify-center transition" title="Bloquear Painel">
        <i class="fas fa-lock text-xs"></i>
      </button>
    </div>
  </header>

  <!-- BARRA OPCIONAL PARA TROCAR LINK DA PLANILHA -->
  <div id="barra-config" class="bg-[#202024] border-b border-gray-800 px-5 py-3 hidden">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row gap-2 items-center">
      <span class="text-xs text-gray-300 font-semibold whitespace-nowrap">
        <i class="fas fa-table text-pink-500 mr-1"></i> Link da Planilha da Manicure:
      </span>
      <input type="text" id="input-planilha" placeholder="Cole o link da planilha do Google Sheets..." 
             class="flex-1 w-full bg-[#121214] border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-pink-500">
      <button onclick="salvarNovaPlanilha()" class="manicure-pink hover:bg-pink-700 text-white px-4 py-2 rounded-xl font-bold text-xs whitespace-nowrap">
        Salvar Planilha
      </button>
    </div>
  </div>

  <!-- FILTROS E BUSCA -->
  <div class="px-5 pt-4 max-w-6xl mx-auto w-full flex flex-col sm:flex-row gap-3 justify-between items-center">
    <div class="relative w-full sm:w-80">
      <i class="fas fa-search absolute left-3.5 top-3 text-gray-400 text-sm"></i>
      <input type="text" id="busca" oninput="renderizar()" placeholder="Buscar cliente, código ou serviço..." 
             class="w-full bg-[#202024] border border-gray-700/80 rounded-xl pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-pink-500 text-white placeholder-gray-500">
    </div>
    
    <div class="flex gap-2 w-full sm:w-auto">
      <button onclick="mudarFiltro('pendentes')" id="btn-pendentes" class="flex-1 sm:flex-none px-4 py-2 rounded-xl bg-pink-600 text-white font-bold text-xs shadow-md">
        Na Agenda
      </button>
      <button onclick="mudarFiltro('todos')" id="btn-todos" class="flex-1 sm:flex-none px-4 py-2 rounded-xl bg-[#202024] text-gray-400 font-bold text-xs hover:text-white">
        Todos
      </button>
    </div>
  </div>

  <!-- GRADE DE AGENDAMENTOS -->
  <main class="flex-1 p-5 max-w-6xl mx-auto w-full">
    <div id="grid-agenda" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>

  <audio id="som-alerta" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

  <script>
    // ==========================================
    // CONFIGURAÇÕES PRINCIPAIS - MANICURE
    // ==========================================
    const SENHA_ACESSO = '1234'; // <-- Senha do painel da manicure
    const SHEET_ID_PADRAO = '17o6cWNHn4SeyvIZ0rElyQIiZmJqfMl5MyUA1nW9JpVg'; // <-- Troque pelo ID da planilha da manicure se for outra
    const WEBHOOK_WHATS = 'https://webhook.painellipe.online/webhook/avisa-whats';

    let sheetId = localStorage.getItem('manicure_sheet_id') || SHEET_ID_PADRAO;
    let agendamentosAtuais = [];
    let statusLocal = JSON.parse(localStorage.getItem('manicure_status_itens') || '{}');
    let filtroAtual = 'pendentes';
    let totalAnterior = 0;
    let intervaloBusca = null;

    function extrairId(urlOuId) {
      const match = String(urlOuId).match(/\/d\/([a-zA-Z0-9-_]+)/);
      return match ? match[1] : String(urlOuId).trim();
    }

    function abrirConfigPlanilha() {
      const barra = document.getElementById('barra-config');
      barra.classList.toggle('hidden');
      document.getElementById('input-planilha').value = sheetId;
    }

    function salvarNovaPlanilha() {
      const val = document.getElementById('input-planilha').value.trim();
      if (!val) return;
      sheetId = extrairId(val);
      localStorage.setItem('manicure_sheet_id', sheetId);
      document.getElementById('barra-config').classList.add('hidden');
      mostrarToast('Planilha atualizada com sucesso!');
      carregarPlanilha();
    }

    function mostrarToast(texto) {
      const t = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = texto;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3500);
    }

    function verificarAutenticacao() {
      const logado = localStorage.getItem('manicure_auth') === SENHA_ACESSO;
      if (logado) {
        document.getElementById('tela-login').classList.add('hidden');
        iniciarPainel();
      } else {
        document.getElementById('tela-login').classList.remove('hidden');
      }
    }

    function fazerLogin(e) {
      e.preventDefault();
      const digitada = document.getElementById('campo-senha').value.trim();
      if (digitada === SENHA_ACESSO) {
        localStorage.setItem('manicure_auth', SENHA_ACESSO);
        document.getElementById('erro-login').classList.add('hidden');
        document.getElementById('campo-senha').value = '';
        verificarAutenticacao();
      } else {
        document.getElementById('erro-login').classList.remove('hidden');
      }
    }

    function fazerLogout() {
      localStorage.removeItem('manicure_auth');
      if (intervaloBusca) clearInterval(intervaloBusca);
      agendamentosAtuais = [];
      document.getElementById('grid-agenda').innerHTML = '';
      verificarAutenticacao();
    }

    function iniciarPainel() {
      carregarPlanilha();
      if (intervaloBusca) clearInterval(intervaloBusca);
      intervaloBusca = setInterval(carregarPlanilha, 4000);
    }

    function corPagamento(forma) {
      const f = (forma || '').toLowerCase();
      if (f.includes('pix')) return 'bg-teal-500/20 text-teal-300 border-teal-500/40';
      if (f.includes('crédito') || f.includes('credito')) return 'bg-purple-500/20 text-purple-300 border-purple-500/40';
      if (f.includes('débito') || f.includes('debito')) return 'bg-blue-500/20 text-blue-300 border-blue-500/40';
      return 'bg-pink-500/20 text-pink-300 border-pink-500/40';
    }

    function formatarValor(v) {
      if (v === undefined || v === null || v === '') return 'R$ 0,00';
      const str = String(v).trim();
      if (str.startsWith('R$')) return str;
      const num = parseFloat(str.replace(',', '.'));
      return isNaN(num) ? str : 'R$ ' + num.toFixed(2).replace('.', ',');
    }

    // Dispara mensagem automática via Webhook do n8n
    async function enviarAvisoWhats(numeroBruto, codigo, servico, dataHora, novoStatus) {
      const numLimpo = String(numeroBruto || '').replace(/\D/g, '');
      if (!numLimpo) {
        mostrarToast('Status atualizado (cliente sem telefone)');
        return;
      }
      const numFinal = numLimpo.startsWith('55') ? numLimpo : '55' + numLimpo;

      let mensagem = '';
      if (novoStatus === 'confirmado') {
        mensagem = `💅 *STUDIO MANICURE*\n\nOlá! Seu agendamento *#${codigo}* (${servico}) para *${dataHora}* está confirmadíssimo! Estamos te esperando. ✨`;
      } else if (novoStatus === 'concluido') {
        mensagem = `💖 *STUDIO MANICURE*\n\nAtendimento *#${codigo}* concluído! Muito obrigada pela preferência e até a próxima! ✨💅`;
      }

      if (!mensagem) return;

      try {
        const url = `${WEBHOOK_WHATS}?numero=${encodeURIComponent(numFinal)}&codigo=${encodeURIComponent(codigo)}&status=${encodeURIComponent(novoStatus)}&mensagem=${encodeURIComponent(mensagem)}`;
        await fetch(url, { method: 'GET', mode: 'no-cors' });
        mostrarToast(`WhatsApp enviado para #${codigo}!`);
      } catch (err) {
        console.error('Erro ao chamar webhook:', err);
        mostrarToast('Erro ao acionar Webhook do WhatsApp');
      }
    }

    function mudarStatusAgendamento(index, novoStatus) {
      const p = agendamentosAtuais[index];
      if (!p) return;
      const idUnico = String(p.codigo || '----') + '_' + (p.data || '');
      
      statusLocal[idUnico] = novoStatus;
      localStorage.setItem('manicure_status_itens', JSON.stringify(statusLocal));
      renderizar();

      if (novoStatus === 'confirmado' || novoStatus === 'concluido') {
        enviarAvisoWhats(p.numero, p.codigo, p.pedido, p.data, novoStatus);
      }
    }

    function mudarFiltro(novo) {
      filtroAtual = novo;
      document.getElementById('btn-pendentes').className = novo === 'pendentes' 
        ? 'flex-1 sm:flex-none px-4 py-2 rounded-xl bg-pink-600 text-white font-bold text-xs shadow-md' 
        : 'flex-1 sm:flex-none px-4 py-2 rounded-xl bg-[#202024] text-gray-400 font-bold text-xs hover:text-white';
      
      document.getElementById('btn-todos').className = novo === 'todos' 
        ? 'flex-1 sm:flex-none px-4 py-2 rounded-xl bg-pink-600 text-white font-bold text-xs shadow-md' 
        : 'flex-1 sm:flex-none px-4 py-2 rounded-xl bg-[#202024] text-gray-400 font-bold text-xs hover:text-white';
      renderizar();
    }

    window.google = {
      visualization: {
        Query: {
          setResponse: function(resposta) {
            if (!resposta || !resposta.table || !resposta.table.rows) return;
            const linhas = resposta.table.rows;
            const lista = linhas.map(r => {
              const c = r.c || [];
              const val = (idx) => c[idx] ? (c[idx].f || c[idx].v || '') : '';
              return {
                data: val(0),
                numero: val(1),
                pedido: val(2),
                valor: val(3),
                pagamento: val(4),
                codigo: val(5)
              };
            }).filter(p => (p.codigo || p.pedido || p.data) && String(p.codigo) !== 'Código de Retirada');

            if (totalAnterior > 0 && lista.length > totalAnterior) {
              document.getElementById('som-alerta').play().catch(() => {});
            }
            totalAnterior = lista.length;
            agendamentosAtuais = lista.reverse();
            renderizar();
          }
        }
      }
    };

    function carregarPlanilha() {
      if (localStorage.getItem('manicure_auth') !== SENHA_ACESSO) return;
      const scriptAntigo = document.getElementById('script-google');
      if (scriptAntigo) scriptAntigo.remove();

      const s = document.createElement('script');
      s.id = 'script-google';
      s.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&headers=1&t=${Date.now()}`;
      document.body.appendChild(s);
    }

    function renderizar() {
      const grid = document.getElementById('grid-agenda');
      const termo = document.getElementById('busca').value.toLowerCase();
      let naFila = 0;

      const html = agendamentosAtuais.map((p, idx) => {
        const codigo = String(p.codigo || (idx + 1));
        const data = p.data || 'Horário a definir';
        const servico = p.pedido || 'Procedimento não informado';
        const valor = formatarValor(p.valor);
        const pagamento = p.pagamento || 'No local';
        const numero = String(p.numero || '');
        const idUnico = codigo + '_' + data;
        
        const estado = statusLocal[idUnico] || 'novo'; // 'novo' | 'confirmado' | 'concluido'
        const isConcluido = estado === 'concluido';
        const isConfirmado = estado === 'confirmado';

        if (!isConcluido) naFila++;
        if (filtroAtual === 'pendentes' && isConcluido) return '';
        if (termo && !codigo.toLowerCase().includes(termo) && !servico.toLowerCase().includes(termo) && !numero.toLowerCase().includes(termo)) return '';

        const numLimpo = numero.replace(/\D/g, '');
        const classeCard = isConcluido ? 'card-concluido' : (isConfirmado ? 'card-confirmado' : '');

        let botoesAcao = '';
        if (estado === 'novo') {
          botoesAcao = `
            <button onclick="mudarStatusAgendamento(${idx}, 'confirmado')" 
                    class="flex-1 py-2.5 rounded-xl font-bold text-xs transition flex items-center justify-center gap-1.5 shadow bg-amber-500 hover:bg-amber-600 active:scale-95 text-black">
              <i class="fas fa-calendar-check"></i> Confirmar Horário
            </button>`;
        } else if (estado === 'confirmado') {
          botoesAcao = `
            <button onclick="mudarStatusAgendamento(${idx}, 'concluido')" 
                    class="flex-1 py-2.5 rounded-xl font-bold text-xs transition flex items-center justify-center gap-1.5 shadow bg-green-600 hover:bg-green-500 active:scale-95 text-white">
              <i class="fas fa-check-circle"></i> Concluir Atendimento
            </button>`;
        } else {
          botoesAcao = `
            <button onclick="mudarStatusAgendamento(${idx}, 'novo')" 
                    class="flex-1 py-2.5 rounded-xl font-bold text-xs transition flex items-center justify-center gap-1.5 shadow bg-gray-700 text-gray-300">
              <i class="fas fa-undo"></i> Reabrir Agendamento
            </button>`;
        }

        const badgeEstado = isConfirmado 
          ? `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">✨ Confirmado</span>`
          : (isConcluido ? `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-green-500/20 text-green-300 border border-green-500/30">💖 Concluído</span>` 
          : `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-pink-500/20 text-pink-300 border border-pink-500/30">🔔 Novo</span>`);

        return `
          <div class="card-agendamento ${classeCard} rounded-2xl p-4 flex flex-col justify-between shadow-lg">
            <div>
              <div class="flex justify-between items-start mb-3">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">Agendamento</span>
                    ${badgeEstado}
                  </div>
                  <div class="text-2xl font-black text-white tracking-tight leading-none mt-1">#${codigo}</div>
                </div>
                <span class="px-2.5 py-1 rounded-lg text-[11px] font-black border ${corPagamento(pagamento)}">
                  ${pagamento}
                </span>
              </div>

              <div class="bg-[#121214] p-3 rounded-xl mb-3 border border-gray-800">
                <span class="text-[11px] text-gray-400 font-medium block mb-1">
                  <i class="fas fa-spa mr-1 text-pink-500"></i> Serviço / Procedimento:
                </span>
                <p class="text-sm font-semibold text-gray-100 whitespace-pre-line leading-relaxed">${servico}</p>
              </div>
            </div>

            <div>
              <div class="flex justify-between items-center text-xs mb-3 pt-2 border-t border-gray-800/80">
                <div class="text-gray-400">
                  <div class="text-gray-200 font-medium"><i class="far fa-calendar-alt mr-1 text-pink-400"></i> ${data}</div>
                  ${numero ? `<div class="mt-0.5"><i class="fab fa-whatsapp text-green-500 mr-1"></i> ${numero}</div>` : ''}
                </div>
                <div class="text-right">
                  <span class="text-[10px] text-gray-400 block font-semibold">Valor</span>
                  <span class="text-base font-black text-green-400">${valor}</span>
                </div>
              </div>

              <div class="flex gap-2">
                ${botoesAcao}
                ${numLimpo ? `
                  <a href="https://wa.me/${numLimpo.startsWith('55') ? numLimpo : '55'+numLimpo}" target="_blank" 
                     class="w-10 h-10 bg-[#29292e] active:bg-gray-700 text-green-400 rounded-xl flex items-center justify-center transition shadow" title="Chamar Cliente no WhatsApp">
                    <i class="fab fa-whatsapp text-base"></i>
                  </a>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('contador-agenda').innerText = naFila;
      grid.innerHTML = html || `
        <div class="col-span-full text-center py-20 text-gray-500">
          <i class="fas fa-calendar-check text-4xl mb-3 text-gray-600 block"></i>
          Nenhum agendamento pendente no momento.
        </div>`;
    }

    verificarAutenticacao();
  </script>
</body>
</html>
